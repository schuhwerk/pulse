<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1c1a14">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>PULSE — Workout Timer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--bg:#131211;--surface:#1d1b19;--surface2:#272522;--surface3:#33302c;--line:rgba(255,240,220,.07);
--text:#f0ece6;--text2:#a7a199;--text3:#78726a;
--accent:#c4ec5a;--accent2:#b4dc4a;--accent-soft:rgba(196,236,90,.12);
--rest:#eeb050;--warn:#eeb050;--danger:#ef5b5f;
--radius:20px;--radius-sm:14px;--tap:44px;
--spring:cubic-bezier(.3,1.25,.5,1);
--shine:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%);
--lift:inset 0 1px 0 rgba(255,255,255,.35),0 8px 24px -10px rgba(196,236,90,.6);--ease-out:cubic-bezier(.16,1,.3,1);
--glass:rgba(29,27,25,.55);--glass-blur:blur(20px) saturate(1.6);--glass-edge:inset 0 1px 0 rgba(255,255,255,.06);
--font:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);font-size:15px;line-height:1.4;color:var(--text);position:relative;-webkit-font-smoothing:antialiased;
  background:radial-gradient(900px 480px at 15% -160px,rgba(238,176,80,.08),transparent 70%),radial-gradient(800px 420px at 85% -180px,rgba(196,236,90,.06),transparent 70%),var(--bg)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit;line-height:inherit}
input,textarea{font-family:inherit;background:var(--surface2);color:var(--text);border:1px solid transparent;border-radius:var(--radius-sm);padding:0 12px;height:44px;font-size:15px;outline:none;width:100%;transition:border-color .15s}
textarea{resize:vertical;min-height:88px;height:auto;padding:11px 12px;line-height:1.45}
input::placeholder,textarea::placeholder{color:var(--text3)}
input:focus,textarea:focus{border-color:rgba(255,255,255,.22)}
.num{font-variant-numeric:tabular-nums}

/* App Shell */
#app{height:100%;display:flex;flex-direction:column;overflow:hidden;max-width:480px;margin:0 auto;position:relative}
.view{--hh:64px;display:none;flex-direction:column;height:100%;overflow:hidden}
#view-home{--hh:84px}
.view.active{display:flex}

/* Header — icon buttons sit 9px in, so their 22px glyphs line up with the 20px content edge */
/* Glass header: fixed height (--hh) so .content can scroll beneath it.
   The glass layer only appears once the list is scrolled (.view.scrolled) and fades out at its edges,
   so it never shows as a hard-edged box against the page background on wide screens. */
.header{height:var(--hh);padding:8px 9px;display:flex;align-items:center;gap:2px;flex-shrink:0;position:relative;z-index:5}
.header::before{content:'';position:absolute;inset:0 0 -14px;z-index:-1;pointer-events:none;opacity:0;transition:opacity .25s ease;
  background:linear-gradient(rgba(19,18,17,.7),rgba(19,18,17,.4) 70%,rgba(19,18,17,0));-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
  -webkit-mask-image:linear-gradient(#000 calc(100% - 22px),transparent);mask-image:linear-gradient(#000 calc(100% - 22px),transparent)}
.view.scrolled .header::before{opacity:1}
@media (min-width:481px){.header::before{
  -webkit-mask-image:linear-gradient(#000 calc(100% - 22px),transparent),linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent);
  -webkit-mask-composite:source-in;mask-image:linear-gradient(#000 calc(100% - 22px),transparent),linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent);mask-composite:intersect}}
.header-title{flex:1;min-width:0;padding:0 6px}
.header-title:first-child{padding-left:11px}
.header h1{font-size:19px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#view-home .header h1{font-size:28px;font-weight:700;letter-spacing:-.025em;line-height:1.1;background:linear-gradient(100deg,var(--text) 45%,var(--accent) 130%);-webkit-background-clip:text;background-clip:text;color:transparent}
#view-home .header{padding-top:16px;padding-bottom:12px}
#view-home .header .subtitle{font-size:14px;margin-top:2px}
.header .subtitle{font-size:13px;color:var(--text2);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-icon{width:var(--tap);height:var(--tap);flex:0 0 var(--tap);display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--text2);transition:background .15s,color .15s}
.btn-icon:hover{background:var(--surface2);color:var(--text)}
.btn-icon svg{width:22px;height:22px;stroke-width:1.75}

/* Scrollable Content */
.content{flex:1;overflow-y:auto;margin-top:calc(-1 * var(--hh));padding:calc(var(--hh) + 4px) 20px 104px;-webkit-overflow-scrolling:touch}
.content{scrollbar-width:none}
.content::-webkit-scrollbar{display:none}
#view-add .content{padding-bottom:24px}
#view-detail .content{padding-bottom:24px}
.detail-desc{margin:0 0 16px;font-size:14px;line-height:1.5;color:var(--text2);text-wrap:pretty}

/* Cards */
.card{background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0) 60%),var(--surface);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px;position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.card:active{background:var(--surface2)}

/* Training Card */
.training-card{display:flex;align-items:center;gap:14px;cursor:pointer;padding:12px 12px 12px 12px;min-height:80px}
.training-card .tile{position:relative;width:56px;height:56px;flex-shrink:0;border-radius:14px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden}
.training-card .tile img{position:absolute;inset:0;width:100%;height:100%;padding:5px;object-fit:contain;background:var(--surface2)}
.training-card .tile img.wger-img{background:#ede8e1}
.training-card .info{flex:1;min-width:0}
.training-card .name{font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.training-card .meta{font-size:13px;color:var(--text2);margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.training-card .play-btn{flex-shrink:0;width:var(--tap);height:var(--tap);border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.training-card .play-btn:hover{background:rgba(196,236,90,.2)}
.training-card .play-btn svg{fill:currentColor;margin-left:2px}
.last-done{color:var(--text3)}

/* Exercise Card */
.exercise-card{display:flex;gap:12px;align-items:center;padding:10px 8px 10px 10px}
.exercise-card .thumb{position:relative;width:56px;height:56px;border-radius:14px;background:var(--surface2);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:26px}
.exercise-card .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:4px;box-sizing:border-box;background:var(--surface2)}
.wger-img,.exercise-card .thumb img.wger-img{background:#ede8e1}
.exercise-card .info{flex:1;min-width:0}
.exercise-card .ex-name{font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exercise-card .ex-dur{font-size:13px;color:var(--text2);font-variant-numeric:tabular-nums;margin-top:5px;display:flex;align-items:center;gap:2px}
.exercise-card .ex-dur .dur{min-width:36px;text-align:center}
.ex-dup{width:32px;height:32px;flex-shrink:0;border-radius:50%;color:var(--text3);display:flex;align-items:center;justify-content:center}
.ex-dup:hover{background:var(--surface2);color:var(--text)}
.ex-dup svg{width:18px;height:18px;stroke-width:1.75}
.quick-btn{font-size:12px;font-weight:500;color:var(--text2);background:var(--surface2);border-radius:6px;height:24px;padding:0 7px;font-variant-numeric:tabular-nums}
.quick-btn:hover{background:var(--surface3);color:var(--text)}
/* Drag reorder */
.reordering{user-select:none;-webkit-user-select:none}
.dragging{opacity:.4;user-select:none}
.drag-over-top{box-shadow:0 -2px 0 var(--accent)}
.drag-over-bot{box-shadow:0 2px 0 var(--accent)}
.drag-ghost{position:fixed;z-index:200;pointer-events:none;opacity:.95;box-shadow:0 10px 30px rgba(0,0,0,.5);border-radius:var(--radius);background:var(--surface2);max-width:calc(100vw - 40px)}
.reorder-hint{text-align:center;padding:0 0 10px;font-size:12px;color:var(--text3)}

/* Floating Action Button (home) */
.fab{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom));right:20px;height:52px;padding:0 22px 0 18px;border-radius:26px;background:var(--shine),var(--accent);color:#111;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;box-shadow:var(--lift);transition:background .15s;z-index:10}
.fab:hover{background:var(--shine),var(--accent2)}
.fab svg{width:20px;height:20px}

/* Bottom Bar (detail) */
.bottom-bar{display:flex;gap:8px;padding:12px 20px calc(16px + env(safe-area-inset-bottom));flex-shrink:0;position:relative;background:var(--bg)}
.bottom-bar::before{content:'';position:absolute;left:0;right:0;bottom:100%;height:24px;background:linear-gradient(rgba(19,18,17,0),var(--bg));pointer-events:none}
.bottom-bar .btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:52px}
.bottom-bar .btn svg{width:18px;height:18px;flex-shrink:0}
.bottom-bar .play-fab{flex:1.4}

/* Buttons */
.btn{height:44px;padding:0 18px;border-radius:999px;font-weight:600;font-size:15px;white-space:nowrap;transition:background .15s,color .15s}
.btn-block{width:100%}
.btn-lg{height:48px}
.btn-sm,.setting-row .btn{height:34px;padding:0 14px;font-size:13px;font-weight:500;flex-shrink:0}
.btn-primary{background:var(--shine),var(--accent);color:#111;box-shadow:var(--lift)}
.btn-primary:hover{background:var(--shine),var(--accent2)}
.btn-secondary{background:var(--surface2);color:var(--text)}
.btn-secondary:hover{background:var(--surface3)}
.btn-danger{background:rgba(239,91,95,.12);color:var(--danger)}
.btn-danger:hover{background:rgba(239,91,95,.2)}
.btn-text-danger{color:var(--danger);font-weight:500}
.btn-text-danger:hover{background:rgba(239,91,95,.08)}
.modal-actions{display:flex;gap:8px}
.modal-actions .btn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.modal-sep{height:1px;background:var(--line);margin:4px 0}
.modal-heading{font-weight:600;font-size:16px;margin-bottom:4px}
.modal-text{color:var(--text2);font-size:14px;line-height:1.5;margin-bottom:8px}
.modal-warn{color:var(--warn);font-weight:600;font-size:14px;margin-bottom:8px}
.modal-list{margin:0 0 12px;padding-left:18px;font-size:14px;max-height:220px;overflow:auto}
.modal-list li{margin:3px 0}
.dim{color:var(--text3)}
.grow{flex:1}
.row{display:flex;gap:8px;align-items:center}
a{color:var(--accent)}
.pre{white-space:pre-wrap}

/* Add Exercise: tabs, search, filters */
.tabs,.lang-toggle{display:flex;padding:3px;gap:2px;background:var(--surface);border-radius:999px}
.tabs{margin-bottom:16px}
.tab{flex:1;text-align:center;height:36px;line-height:36px;border-radius:999px;font-size:14px;font-weight:500;color:var(--text2);cursor:pointer;transition:background .15s,color .15s}
.tab.active,.lang-toggle button.active{background:var(--surface3);color:var(--text)}
.lang-toggle{flex-shrink:0;height:44px;font-size:13px;font-weight:500}
.lang-toggle button{padding:0 12px;border-radius:999px;color:var(--text2);transition:background .15s,color .15s}
.search-box{position:relative;flex:1}
.search-box input{padding-left:42px;border-radius:999px}
.search-box svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--text3)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.chip{height:32px;padding:0 14px;border-radius:16px;font-size:13px;font-weight:500;color:var(--text2);border:1px solid var(--line);transition:background .15s,color .15s}
.chip:hover{color:var(--text)}
.chip.active{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.subtle-link{display:inline-block;font-size:13px;color:var(--text2);margin:0 0 16px;text-decoration:none}
.subtle-link:hover{color:var(--text)}
.search-result{padding:10px 12px;cursor:pointer;display:flex;align-items:center;gap:12px}
.search-result:hover{background:var(--surface2)}
.search-result .sr-thumb{width:48px;height:48px;border-radius:8px;background:var(--surface2);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.search-result .sr-thumb img{width:100%;height:100%;object-fit:contain}
.search-result .sr-info{flex:1;min-width:0}
.search-result .sr-name{font-weight:500;font-size:15px}
.search-result .sr-cat{font-size:13px;color:var(--text2);margin-top:2px}
.search-result .sr-snip{font-size:12px;color:var(--text3);margin-top:4px;line-height:1.4}
#ed-wger-status{font-size:13px;color:var(--text2);min-height:16px;max-height:260px;overflow-y:auto}
#ed-wger-status:empty{display:none}
#ed-wger-status .pick-title{font-weight:500;margin-bottom:6px}
#ed-wger-status .search-result{margin:4px 0;background:var(--surface2)}
.search-loader{text-align:center;padding:40px 20px;color:var(--text3);font-size:14px;line-height:1.5}
.search-loader small{display:block;margin-top:4px;font-size:13px}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:100;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:rgba(29,27,25,.82);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);box-shadow:var(--glass-edge);border-radius:26px 26px 0 0;width:100%;max-width:480px;max-height:88vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.modal-header{padding:16px 12px 8px 20px;display:flex;align-items:center;gap:12px;position:relative}
.modal-header::before{content:'';position:absolute;top:7px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--surface3)}
.modal-header h2{font-size:19px;font-weight:700;letter-spacing:-.01em;flex:1}
.modal-body{padding:8px 20px 24px;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:16px}
.exform{display:flex;flex-direction:column;gap:16px}
.exhead{display:flex;gap:12px;align-items:flex-end}
.illu{position:relative;width:70px;height:70px;flex-shrink:0;border-radius:12px;background:var(--surface2);border:1px solid transparent;overflow:hidden}
.illu:focus-within{border-color:rgba(255,255,255,.22)}
.illu img{width:100%;height:100%;object-fit:contain;padding:5px;box-sizing:border-box;display:block}
.illu img[hidden]{display:none}
.illu .illu-emoji{position:absolute;inset:0;width:100%;height:100%;border:none;border-radius:0;background:none;padding:0;text-align:center;font-size:32px;cursor:pointer;outline:none}
.illu.has-img .illu-emoji{inset:auto 3px 3px auto;width:24px;height:24px;font-size:13px;border-radius:6px;background:var(--surface3)}
.illu-hint{font-size:12px;color:var(--text3)}
.illu-hint:empty{display:none}
.field{display:flex;flex-direction:column;gap:6px}
.field>label{font-size:13px;color:var(--text2);font-weight:500}
.dur-input{display:flex;align-items:center;gap:8px}
.dur-input input{width:76px;text-align:center;font-variant-numeric:tabular-nums;font-size:16px}
.dur-input span{color:var(--text2);font-size:14px}

/* Player View */
@property --glow{syntax:'<color>';inherits:true;initial-value:rgba(0,0,0,0)}
.player{--glow:rgba(0,0,0,0);display:grid;grid-template-rows:1fr auto auto;height:100%;padding:64px 24px 0;text-align:center;position:relative;overflow:hidden;isolation:isolate;transition:--glow .8s ease}
.player::before{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(75% 40% at 50% 66%,var(--glow),transparent 72%)}
.player[data-phase=exercise],.player[data-phase=done]{--glow:rgba(196,236,90,.10)}
.player[data-phase=rest],.player[data-phase=prepause]{--glow:rgba(238,176,80,.09)}
/* Exercise progress: a fill level rising from the bottom. --p = elapsed share of the exercise (0…1);
   the bright edge is the level and touches the top of the screen when the time runs out. Flashes at half-time. */
.player::after{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;transform:translateY(calc((1 - var(--p,0)) * 100%));
  background:linear-gradient(to bottom,color-mix(in srgb,var(--accent) 38%,transparent),var(--wash) 3px,var(--wash) 40px,color-mix(in srgb,var(--wash) 45%,transparent));
  opacity:0;transition:transform 1s linear,opacity .6s ease}
.player[data-phase=exercise]::after{opacity:1}
.player:not([data-phase=exercise])::after{transition:opacity .6s ease,transform 0s .6s}
.player.half::after{animation:half-flash 1.1s ease-out}
@property --wash{syntax:'<color>';inherits:false;initial-value:rgba(196,236,90,.14)}
@keyframes half-flash{15%{--wash:rgba(196,236,90,.34)}100%{--wash:rgba(196,236,90,.14)}}
.player-top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:2}
/* No backdrop blur inside the player: what sits behind is smooth gradients, where blur is invisible but re-renders on every animated frame. */
.player-top .btn-icon{background:var(--glass);box-shadow:var(--glass-edge);color:var(--text)}
.player-top .btn-icon:hover{background:rgba(39,37,34,.7)}
.player-top .btn-icon svg{width:24px;height:24px}
.player-top-zone{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;overflow:hidden;overflow-y:auto;position:relative;margin:0 -24px;padding:0 24px}
.pl-card{display:flex;flex-direction:column;align-items:center;width:100%;flex-shrink:0}
.pl-ghost{position:absolute;margin:0;pointer-events:none}
.player{touch-action:pan-y}
.player.dragging{-webkit-user-select:none;user-select:none;cursor:grabbing}
.player-phase{--ph:var(--text2);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ph);background:color-mix(in srgb,var(--ph) 14%,transparent);padding:6px 14px;border-radius:999px;margin-bottom:20px}
.player-phase.is-exercise{--ph:var(--accent)}
.player-phase.is-rest{--ph:var(--rest)}
.player-exercise{font-size:2em;font-weight:700;letter-spacing:-.02em;margin-bottom:8px;line-height:1.15;text-wrap:balance;overflow-wrap:anywhere}
.player-exercise,.player-desc{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.player-exercise{-webkit-line-clamp:2}
/* Room for a two-line name and the description, so the image above never moves */
.pl-text{--lines:4;width:100%;max-width:34em;font-size:15px;line-height:1.5;height:calc(4.6em + 8px + (var(--lines) + 1.1) * 1lh);padding:0 8px}
.player-desc{color:var(--text2);-webkit-line-clamp:var(--lines);text-wrap:balance}
.pl-text .more-btn{margin-top:4px;font-size:13px;color:var(--text3);font-weight:500}
.pl-text .more-btn:hover{color:var(--text)}
/* The box fits the larger photo tile, so the emoji circle sits at the same height */
.player-image-wrap{--img:200px;position:relative;flex-shrink:0;height:var(--img);display:flex;align-items:center;margin-bottom:24px}
.player-image{position:relative;width:156px;height:156px;border-radius:50%;background:var(--surface);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:72px}
.player-image:not(:has(img)){background:linear-gradient(160deg,rgba(255,255,255,.035),rgba(255,255,255,0) 60%),rgba(39,37,34,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),inset 0 0 0 1px rgba(255,255,255,.03),0 12px 32px -18px rgba(0,0,0,.35)}
.player-image:has(img){border-radius:28px;width:var(--img);height:var(--img)}
.player-image:has(img.wger-img){background:#ede8e1}
.player-image img{position:absolute;inset:12px;width:calc(100% - 24px);height:calc(100% - 24px);object-fit:contain;background:inherit}
@media (max-height:700px){.player-image{width:96px;height:96px;font-size:48px}.player-image-wrap{--img:120px;margin-bottom:14px}.player-phase{margin-bottom:12px}.pl-text{--lines:2}.player-timer{font-size:80px}}
#pl-upnext{position:absolute;bottom:-16px;left:50%;background:rgba(51,48,44,.72);color:var(--rest);font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:7px 15px;border-radius:16px;white-space:nowrap;z-index:3;box-shadow:0 2px 10px rgba(0,0,0,.4);pointer-events:none;transform:translateX(-50%);opacity:0}
#pl-upnext.on{opacity:1}
.player-mid-zone{display:flex;flex-direction:column;align-items:center;padding:16px 0 8px}
.player-timer{font-size:100px;font-weight:600;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.player-timer.rest-time{color:var(--rest)}
.player-progress{position:relative;width:100%;max-width:280px;height:6px;background:var(--surface2);border-radius:3px;margin-top:20px}
.player[data-phase=exercise] .player-progress::after{content:'';position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--bg)}
.player-progress-bar{--c:var(--accent);height:100%;background:var(--c);box-shadow:0 0 12px color-mix(in srgb,var(--c) 55%,transparent);transition:width .3s linear,background .3s;border-radius:3px}
.player-progress-bar.resting{--c:var(--rest)}
.player-bot-zone{display:flex;flex-direction:column;align-items:center;padding-bottom:max(24px,env(safe-area-inset-bottom));flex-shrink:0}
.player-meta{display:flex;justify-content:center;align-items:baseline;max-width:100%;min-height:20px;margin-top:4px;font-size:14px;color:var(--text3)}
.player-counter{font-variant-numeric:tabular-nums;flex-shrink:0}
.player-upcoming{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-upcoming:not(:empty)::before{content:'·';margin:0 8px}
.player-upcoming span{color:var(--text2)}
.player-controls{display:flex;gap:24px;margin-top:20px;align-items:center}
.player-controls button{width:52px;height:52px;border-radius:50%;background:var(--glass);box-shadow:var(--glass-edge);color:var(--text);display:flex;align-items:center;justify-content:center;transition:background .15s}
.player-controls button:hover{background:rgba(39,37,34,.7)}
.player-controls button svg{width:22px;height:22px}
.player-controls .play-pause,.player-controls .play-pause:hover{position:relative;width:76px;height:76px;background:var(--shine),var(--accent);color:#111;box-shadow:var(--lift)}
.player-controls .play-pause.running::after{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);animation:pulse-ring 2.4s var(--ease-out) 2;pointer-events:none}
@keyframes pulse-ring{from{transform:scale(1);opacity:.35}to{transform:scale(1.4);opacity:0}}
.player-controls .play-pause svg{width:28px;height:28px}
.player-timer.finish-check{color:#111;background:var(--shine),var(--accent);box-shadow:var(--lift);width:88px;height:88px;animation:pop-in .6s var(--spring) .15s both;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:600;letter-spacing:0;margin:16px auto;cursor:pointer;border:none;transition:transform .15s}
.player-timer.finish-check:active{transform:scale(.96)}

/* Toast */
.toast-wrap{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;z-index:200;pointer-events:none;padding:0 16px}
.toast{background:rgba(51,48,44,.7);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);color:var(--text);padding:11px 20px;border-radius:999px;font-size:14px;font-weight:500;box-shadow:var(--glass-edge),0 6px 24px rgba(0,0,0,.4);max-width:100%;text-align:center;opacity:0;transform:translateY(16px) scale(.9);transition:opacity .2s ease,transform .35s var(--spring)}
.toast.show{opacity:1;transform:none}

/* Empty State */
.empty-state{text-align:center;padding:64px 20px;color:var(--text2)}
.empty-state .icon{font-size:40px;margin-bottom:12px;opacity:.85}
.empty-state p{font-size:15px;line-height:1.6}

/* Settings row */
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.setting-row:first-child{padding-top:0}
.setting-row input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;width:120px;flex-shrink:0;height:20px;border:none;outline:none;margin:0;padding:0}
.setting-row input[type=range]:focus{outline:none}
.setting-row input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:rgba(255,255,255,.14)}
.setting-row input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.14)}
.setting-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);margin-top:-7px;border:none}
.setting-row input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);border:none}
.setting-row input[type=range].muted::-webkit-slider-thumb{background:var(--danger)}
.setting-row input[type=range].muted::-moz-range-thumb{background:var(--danger)}
.setting-label{font-size:15px;font-weight:500;min-width:0}
.setting-label small{display:block;color:var(--text2);font-size:13px;font-weight:400;margin-top:2px;line-height:1.35}
.toggle{position:relative;display:inline-block;width:44px;height:26px;flex-shrink:0}
/* Minimum touch target: compact controls keep their look but get an invisible hit area of at least --tap */
.quick-btn,.chip,.btn-sm,.setting-row .btn,.tab,.lang-toggle button,.more-btn,.ex-dup{position:relative}
.quick-btn::after,.chip::after,.btn-sm::after,.setting-row .btn::after,.tab::after,.lang-toggle button::after,.more-btn::after,.ex-dup::after,.toggle::after{content:'';position:absolute;left:50%;top:50%;width:max(100%,var(--tap));height:max(100%,var(--tap));transform:translate(-50%,-50%)}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle-slider{position:absolute;inset:0;border-radius:13px;background:rgba(255,255,255,.14);cursor:pointer;transition:background .2s}
.toggle-slider:before{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle input:checked+.toggle-slider{background:var(--accent)}
.toggle input:checked+.toggle-slider:before{transform:translateX(18px)}
.about{padding:16px 0 0;text-align:center;color:var(--text2);font-size:13px;line-height:1.7}
.about strong{color:var(--text);font-size:15px;font-weight:600}

/* Inline tag */
.tag{display:inline-block;background:var(--surface2);color:var(--text2);font-size:12px;padding:2px 7px;border-radius:6px;margin-left:6px}
/* Motion */
.btn,.btn-icon,.fab,.chip,.tab,.quick-btn,.lang-toggle button,.training-card .play-btn,.player-controls button,.ex-dup{transition:background .15s,color .15s,transform .25s var(--spring)}
.btn:active,.btn-icon:active,.fab:active,.chip:active,.quick-btn:active,.training-card .play-btn:active,.player-controls button:active,.ex-dup:active{transform:scale(.95)}
.card{transition:background .15s,transform .25s var(--spring)}
.card:active{transform:scale(.985)}
.view.active{animation:view-in .35s var(--ease-out)}
.view.entering .card{animation:rise .5s var(--ease-out) both;animation-delay:calc(var(--i,0) * 40ms)}
.modal-overlay.open{animation:fade-in .2s ease-out}
.modal-overlay.open .modal{animation:sheet-up .4s var(--ease-out)}
.player-top-zone.swap .player-image{animation:settle .45s var(--ease-out)}
.player-top-zone.swap .pl-text>*{animation:rise .4s var(--ease-out) both}
.player-top-zone.swap .pl-text>*+*{animation-delay:.05s}
.player-timer.tick{animation:tick .35s var(--spring)}
.player-image.trophy{animation:pop-in .5s var(--spring) both}
@keyframes view-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@keyframes sheet-up{from{transform:translateY(100%)}to{transform:none}}
@keyframes dialog-in{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
/* Wide screens: modals become centered dialogs instead of bottom sheets */
@media (min-width:720px) and (min-height:560px){
  /* Top spacing lives inside the header so the list scrolls up to the window edge, not a hard line below it */
  .view{--hh:96px}
  #view-home{--hh:116px}
  .header,#view-home .header{padding-top:40px}
  #view-player{padding-top:32px}
  .modal-overlay{align-items:center;padding:24px}
  .modal{border-radius:24px;max-height:min(760px,86vh);padding-bottom:0;box-shadow:0 24px 64px rgba(0,0,0,.5)}
  .modal-header{padding-top:14px}
  .modal-header::before{display:none}
  .modal-overlay.open .modal{animation:dialog-in .3s var(--ease-out)}
}
@keyframes pop-in{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@keyframes tick{from{transform:scale(1.08)}to{transform:none}}
@keyframes settle{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">

<!-- HOME VIEW -->

    </button>
  </div>
  <div class="content" id="home-list"></div>
  <button class="fab" onclick="promptNewTraining()" title="New Training"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>New training</button>
</div>

<!-- TRAINING DETAIL VIEW -->
<div id="view-detail" class="view">
  <div class="header">
    <button class="btn-icon" onclick="goHome()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="header-title"><h1 id="detail-title">Training</h1><div class="subtitle" id="detail-duration">0:00</div></div>
    <button class="btn-icon" onclick="shareTraining()" title="Share">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
    </button>
    <button class="btn-icon" onclick="editTrainingName()" title="Edit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    </button>
  </div>
  <div class="content" id="detail-exercises"></div>
  <div class="bottom-bar">
    <button class="btn btn-secondary btn-add" onclick="openAddExercise()" title="Add Exercise"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add exercise</button>
    <button class="btn btn-primary play-fab" onclick="startPlayer()" title="Start"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6,4 19,12 6,20"/></svg>Start</button>
  </div>
</div>

<!-- ADD EXERCISE VIEW -->
<div id="view-add" class="view">
  <div class="header">
    <button class="btn-icon" onclick="goDetail()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="header-title"><h1>Add exercise</h1></div>
  </div>
  <div class="content">
    <div class="tabs">
      <div class="tab active" data-tab="search" onclick="switchTab(this,'search')">Search wger</div>
      <div class="tab" data-tab="manual" onclick="switchTab(this,'manual')">Manual</div>
    </div>
    <div id="tab-search">
      <div class="row">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>

<!-- PLAYER VIEW -->
<div id="view-player" class="view">

      </button>

        <div class="pl-text">
          <div class="player-exercise" id="pl-name">—</div>
          <div class="player-desc" id="pl-desc"></div>
          <button class="more-btn" id="pl-more" onclick="showDesc()" hidden>more</button>
        </div>
      </div>
    </div>
    <div class="player-mid-zone">
      <div class="player-timer" id="pl-timer">0</div>
      <div class="player-progress"><div class="player-progress-bar" id="pl-bar"></div></div>
    </div>
    <div class="player-bot-zone">
      <div class="player-meta"><span class="player-counter" id="pl-counter">0 / 0</span><span class="player-upcoming" id="pl-next"></span></div>

          <svg id="pp-play" viewBox="0 0 24 24" fill="currentColor" style="display:none"><polygon points="5,3 19,12 5,21"/></svg>

        <button onclick="playerNext()"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 18h2V6h-2zM6 18l8.5-6L6 6z"/></svg></button>
      </div>

</div>

<!-- MODAL: Edit Exercise Duration / Settings -->

    <div class="modal-body" id="modal-body"></div>

// Normalize a plain training (builtin, imported, or exported) → stored training with fresh ids.
function hydrateTraining(t){
  const defaultSeconds = Number.isFinite(t.defaultSeconds) ? t.defaultSeconds : DEFAULT_DUR;
  return {
    id: uid(),
    name: String(t.name||'Untitled'),
    description: t.description||'',
    restSeconds: Number.isFinite(t.restSeconds)?t.restSeconds:DEFAULT_REST,
    exercises: (t.exercises||[]).map(e=>{
      const o={ id:uid(), name:String(e.name||''), description:e.description||'', imageUrl:wgerImg(e.imageUrl||''), emoji:e.emoji||'💪', s:Number.isFinite(e.s)?e.s:defaultSeconds };
      if(e.restAfterSeconds!=null) o.restAfterSeconds=Number(e.restAfterSeconds);
      return o;
    }),
  };
}
function builtinFingerprint(t){ return JSON.stringify(t); }
function hydrateBuiltin(t){ const h=hydrateTraining(t); h.builtinId=t.builtinId; h.builtinHash=builtinFingerprint(t); return h; }
// Serialize a training to a compact payload (shared by share-link and JSON export).
// Picks the most common exercise duration as `defaultSeconds`; exercises matching it omit `s`.
function toSharePayload(t){
  const counts={};
  for(const e of t.exercises){ counts[e.s]=(counts[e.s]||0)+1; }
  let defaultSeconds=null, best=0;
  for(const k in counts){ if(counts[k]>best){ best=counts[k]; defaultSeconds=Number(k); } }
  const p={ name:t.name, restSeconds:t.restSeconds };
  if(t.description) p.description=t.description;
  if(defaultSeconds!=null) p.defaultSeconds=defaultSeconds;
  p.exercises=t.exercises.map(e=>{
    const o={ name:e.name, emoji:e.emoji };
    if(e.s!==defaultSeconds) o.s=e.s;
    if(e.description) o.description=e.description;
    // Strip the wger host to save URL space; hydrateTraining re-expands via wgerImg().
    if(e.imageUrl) o.imageUrl=e.imageUrl.replace(/^https:\/\/wger\.de/,'');
    if(e.restAfterSeconds!=null) o.restAfterSeconds=e.restAfterSeconds;
    return o;
  });
  return p;
}
// Links longer than this get silently truncated by many messengers / servers,
// which is the classic "shared link won't import" failure. Warn instead.
const SHARE_URL_MAX=8000;
// ── base64url <-> bytes ──
function bytesToB64url(bytes){
  let bin=''; for(let i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64urlToBytes(s){
  const bin=atob(s.replace(/-/g,'+').replace(/_/g,'/'));
  const out=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}
// Pump bytes through a (De)CompressionStream and collect the result.
async function streamBytes(bytes,stream){
  const writer=stream.writable.getWriter(); writer.write(bytes); writer.close();
  const reader=stream.readable.getReader(); const chunks=[]; let len=0;
  for(;;){ const {done,value}=await reader.read(); if(done) break; chunks.push(value); len+=value.length; }
  const out=new Uint8Array(len); let o=0; for(const c of chunks){ out.set(c,o); o+=c.length; }
  return out;
}
// deflate-raw shrinks the verbose, repetitive wger HTML descriptions dramatically.
async function encodeShareUrl(t){
  const json=JSON.stringify(toSharePayload(t));
  const data=bytesToB64url(await streamBytes(new TextEncoder().encode(json),new CompressionStream('deflate-raw')));
  return location.origin+location.pathname+'#import='+data;
}
async function decodeSharePayload(s){
  const out=await streamBytes(b64urlToBytes(s),new DecompressionStream('deflate-raw'));
  return JSON.parse(new TextDecoder().decode(out));
}
async function shareTraining(){
  const t=getTraining(); if(!t) return;
  let url;
  try{ url=await encodeShareUrl(t); }
  catch(e){ toast('Could not create share link'); return; }
  if(url.length>SHARE_URL_MAX){
    toast('Workout too large for a link — use Export to a file instead');
    return;
  }
  try{
    if(navigator.share){ await navigator.share({title:t.name,url}); }
    else{ await navigator.clipboard.writeText(url); toast('Link copied'); }
  }catch(e){ /* user cancelled */ }
}

function load(){

    for(const t of parsed.trainings||[]){
      for(const e of t.exercises||[]){ if(!Number.isFinite(e.s)) e.s=Number.isFinite(e.durationSeconds)?e.durationSeconds:DEFAULT_DUR; }

// Time ago helper
function timeAgo(ts){
  const then=new Date(ts),now=new Date();
  const d=now-then,s=Math.floor(d/1000),m=Math.floor(s/60),h=Math.floor(m/60);
  const todayMidnight=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  const thenMidnight=new Date(then.getFullYear(),then.getMonth(),then.getDate()).getTime();
  const dy=Math.round((todayMidnight-thenMidnight)/86400000);
  if(dy>30)return then.toLocaleDateString();
  if(dy>0)return dy===1?'yesterday':dy+' days ago';
  if(h>0)return h+'h ago';
  if(m>0)return m+'m ago';
  return 'just now';
}

// ─── Reorder (long-press drag, Pointer Events) ────────────────
// Long-press (400 ms) on a card starts a drag; moving >5 px before that cancels,

// Cards need data-idx; buttons inside a card keep their own click behaviour.
const REORDER_LISTS=[
  {container:'detail-exercises',card:'.exercise-card',list:()=>getTraining().exercises,render:()=>renderDetail(),onTap:i=>editExercise(i)},

// Listeners sit on the containers, which survive re-renders, so bind once.
function initReorder(){
  for(const cfg of REORDER_LISTS){
    const c=$(cfg.container);
    c.addEventListener('pointerdown',ev=>drStart(ev,cfg));
    c.addEventListener('click',ev=>drCardClick(ev,cfg));
    // Pointer events can't stop touch scrolling; a non-passive touchmove can.
    c.addEventListener('touchmove',ev=>{if(drag.active)ev.preventDefault();},{passive:false});
    c.addEventListener('contextmenu',ev=>{if(drag.active)ev.preventDefault();});
  }
}
function drCardClick(ev,cfg){
  if(drag.blockClick||onControl(ev))return;
  const card=ev.target.closest(cfg.card);
  if(card)cfg.onTap(+card.dataset.idx);
}
function drStart(ev,cfg){
  if(ev.button>0||onControl(ev))return;
  const card=ev.target.closest(cfg.card);if(!card)return;
  drag.cfg=cfg;drag.startX=ev.clientX;drag.startY=ev.clientY;drag.overIdx=null;

function drActivate(card){
  drag.active=true;drag.idx=+card.dataset.idx;
  navigator.vibrate?.(30);
  getSelection()?.removeAllRanges();
  document.body.classList.add('reordering');
  const r=card.getBoundingClientRect(),g=card.cloneNode(true);
  g.classList.add('drag-ghost');
  Object.assign(g.style,{width:r.width+'px',left:r.left+'px',top:r.top+'px'});
  document.body.appendChild(g);drag.ghost=g;
  card.classList.add('dragging');
  drag.cards=[...$(drag.cfg.container).querySelectorAll(drag.cfg.card)];
}
function drMove(ev){
  if(!drag.active){
    if(Math.abs(ev.clientX-drag.startX)>5||Math.abs(ev.clientY-drag.startY)>5)drFinish();
    return;
  }
  ev.preventDefault();
  const y=ev.clientY;
  drag.ghost.style.top=(y-30)+'px';
  // Auto-scroll near the container edges
  // (the header overlays the scroller, so measure from its bottom edge)
  const container=$(drag.cfg.container),cr=container.getBoundingClientRect();
  const hd=container.closest('.view').querySelector('.header'),top=hd?hd.getBoundingClientRect().bottom:cr.top;
  if(y<top+50)container.scrollTop-=8;
  else if(y>cr.bottom-50)container.scrollTop+=8;
  drag.cards.forEach(c=>c.classList.remove('drag-over-top','drag-over-bot'));
  const over=drag.cards.find(c=>{const r=c.getBoundingClientRect();return y>r.top&&y<r.bottom;});
  if(over&&+over.dataset.idx!==drag.idx){
    const r=over.getBoundingClientRect(),above=y<r.top+r.height/2;
    over.classList.add(above?'drag-over-top':'drag-over-bot');
    drag.overIdx=+over.dataset.idx+(above?0:1);
    if(drag.overIdx>drag.idx)drag.overIdx--;
  }
}
function drFinish(){
  clearTimeout(drag.timer);drag.timer=null;
  document.removeEventListener('pointermove',drMove);
  document.removeEventListener('pointerup',drFinish);
  document.removeEventListener('pointercancel',drFinish);
  if(!drag.active)return;
  document.body.classList.remove('reordering');
  drag.ghost.remove();
  drag.cards.forEach(c=>c.classList.remove('dragging','drag-over-top','drag-over-bot'));
  const {idx,overIdx,cfg}=drag;
  Object.assign(drag,{active:false,ghost:null,cards:[],blockClick:true});
  setTimeout(()=>{drag.blockClick=false;},350); // swallow the click that ends the drag
  if(overIdx!==null&&overIdx!==idx){
    const list=cfg.list();
    list.splice(overIdx,0,list.splice(idx,1)[0]);
    save();cfg.render();
  }
}

function debounceSearch(){ clearTimeout(searchTimeout); searchTimeout=setTimeout(searchWger,400); }

const LANG_IDS={en:2,de:1};

// When searching in German, include English results too.
async function wgerSearch(q,limit,equipment=[]){
  const lang=wgerLang==='de'?'de,en':'en';
  const equip=equipment.map(id=>'&equipment='+id).join('');
  const url=`https://wger.de/api/v2/exerciseinfo/?format=json&name__search=${encodeURIComponent(q)}&language__code=${lang}${equip}&limit=${limit}`;
  return (await (await fetch(url)).json()).results||[];
}
function wgerFirstImg(e){ return wgerImg(e.images?.[0]?.image); }
// Result card shared by the Add search and the Edit "Enhance from wger" picker.
// `full` adds equipment and a description snippet.
function wgerCard(e,onclick,full){
  const img=wgerFirstImg(e);
  const meta=[e.category?.name,(e.muscles||[]).map(m=>m.name_en||m.name).join(', ')];
  let snip='';
  if(full){
    meta.push((e.equipment||[]).map(eq=>eq.name).join(', '));
    const d=wgerDesc(e).replace(/\n+/g,' ');
    snip=d.length>80?d.slice(0,80)+'…':d;
  }
  return `<div class="card search-result" onclick="${onclick}">
    ${img?`<div class="sr-thumb"><img src="${esc(img)}" alt="" loading="lazy"></div>`:''}
    <div class="sr-info"><div class="sr-name">${esc(wgerTr(e).name||'?')}</div>
    <div class="sr-cat">${esc(meta.filter(Boolean).join(' · '))}</div>
    ${snip?`<div class="sr-snip">${esc(snip)}</div>`:''}</div>
  </div>`;
}

async function searchWger(){
  const q=$('wger-search').value.trim();
  const c=$('wger-results');
  if(!q){c.innerHTML='<div class="search-loader">Type to search…</div>';return;}
  c.innerHTML='<div class="search-loader">Searching…</div>';
  try{
    wgerSearchResults=(await wgerSearch(q,50,[...selectedEquipment])).slice(0,25);
    if(!wgerSearchResults.length){c.innerHTML='<div class="search-loader">No exercises found for "'+esc(q)+'"</div>';return;}
    c.innerHTML=wgerSearchResults.map((e,i)=>wgerCard(e,`pickWgerResult(${i})`,true)).join('');
  }catch(err){c.innerHTML='<div class="search-loader">⚠️ Cannot reach wger.de<br><small>Check your connection, or use the Manual tab.</small></div>';}
}

// Pick best translation for current language, fallback to English
function wgerTr(e){
  const trs=e.translations||[];
  return trs.find(t=>t.language===LANG_IDS[wgerLang])||trs.find(t=>t.language===LANG_IDS.en)||trs[0]||{};
}
// wger descriptions are HTML; flatten to plain text with line breaks and bullets.
function cleanDesc(s){
  if(!s)return '';
  return s
    .replace(/<\/?(p|div|br|hr)\s*\/?>/gi,'\n')
    .replace(/<li\s*>/gi,'\n• ')
    .replace(/<\/li>/gi,'')
    .replace(/<\/?(ol|ul)\s*>/gi,'\n')
    .replace(/<[^>]*>/g,'')
    .replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'")
    .replace(/[ \t]+/g,' ')
    .replace(/ ?\n ?/g,'\n')
    .replace(/\n{3,}/g,'\n\n')
    .trim();
}
// First non-empty description: selected language, then English, then any.
function wgerDesc(e){
  const trs=e.translations||[];
  for(const tr of [trs.find(t=>t.language===LANG_IDS[wgerLang]),trs.find(t=>t.language===LANG_IDS.en),...trs]){
    const d=cleanDesc(tr?.description);
    if(d)return d;
  }
  return '';
}

function pickWgerResult(idx){
  const e=wgerSearchResults[idx]; if(!e)return;
  const t=getTraining(); if(!t)return;
  const name=wgerTr(e).name||'Exercise';
  t.exercises.push({id:uid(),name,description:wgerDesc(e),imageUrl:wgerFirstImg(e),emoji:'🏋️',s:DEFAULT_DUR});
  save(); toast('Added: '+name); goDetail();
}

function addManualExercise(){
  const t=getTraining(); if(!t)return;
  const f=readExForm('man');
  if(!f.name){toast('Name is required');return;}
  t.exercises.push({id:uid(),...f});
  save(); toast('Added: '+f.name);
  guardForm($('tab-manual'));
  goDetail();
}

// the fallback (and the icon in list views).

    <div class="exhead">
      <div class="illu" id="${p}-illu">
        <img id="${p}-illu-img" alt="" hidden>
        <input id="${p}-emoji" class="illu-emoji" value="${esc(e.emoji||'')}" placeholder="💪" autocomplete="off" aria-label="Emoji" title="Emoji (fallback when there is no image)" oninput="renderIllu('${p}')">
      </div>
      <div class="field grow"><label>Name</label><input id="${p}-name" value="${esc(e.name||'')}" placeholder="e.g. Burpees"></div>
    </div>

      <input id="${p}-img" value="${esc(e.imageUrl||'')}" placeholder="Optional — replaces the emoji" autocomplete="off" oninput="renderIllu('${p}')">
      <div class="illu-hint" id="${p}-illu-hint"></div>

    <div class="row" style="gap:12px">

function renderIllu(p){
  const box=$(p+'-illu'); if(!box)return;
  const img=$(p+'-illu-img');
  const hint=$(p+'-illu-hint');
  const url=$(p+'-img').value.trim();
  const show=on=>{box.classList.toggle('has-img',on);img.hidden=!on;};
  box.classList.toggle('wger-img',isWgerUrl(url));
  if(!url){show(false);img.removeAttribute('src');hint.textContent='';return;}
  img.onload=()=>{show(true);hint.textContent='The emoji badge is the fallback if the image can\'t load.';};
  img.onerror=()=>{show(false);box.classList.remove('wger-img');hint.textContent='Image failed to load — the emoji is shown instead.';};
  if(img.getAttribute('src')!==url)img.src=url;
}
function readExForm(p){
  const v=id=>$(p+'-'+id).value;
  const rv=v('rest');
  return {
    name:v('name').trim(),
    emoji:firstGrapheme(v('emoji'))||'💪',
    imageUrl:v('img').trim(),
    description:v('desc'),
    s:parseInt(v('dur'))||30,
    restAfterSeconds:rv!==''?parseInt(rv):null,

}

// ─── Player ───────────────────────────────────────────────────
function startPlayer(){
  const t=getTraining(); if(!t||!t.exercises.length){toast('Add exercises first');return;}
  pl.training={...t,exercises:[...t.exercises]};
  pl.view=null;
  document.querySelectorAll('.pl-ghost').forEach(g=>g.remove());
  $('pl-image').classList.remove('trophy');
  location.hash='player:'+currentTrainingId;
  showView('view-player');
  document.querySelector('.player-controls').style.display='';
  const tm=$('pl-timer'); tm.onclick=null; tm.removeAttribute('role'); tm.removeAttribute('tabindex');
  audioCtx.resume().catch(()=>{}); // unlock AudioContext while still in user-gesture
  requestWakeLock();
  beginPrepause();
}

const curEx=()=>pl.training.exercises[pl.exerciseIdx];
function segmentDuration(){
  return pl.phase==='prepause' ? PREPAUSE_SECONDS
    : pl.phase==='rest' ? getRestAfter(curEx(),pl.training)
    : curEx().s;
}
function beginSegment(phase){
  pl.phase=phase; pl.running=true;
  pl.secondsLeft=segmentDuration();
  renderSegment(); renderPlayer(); startTick();
}
function beginPrepause(){ pl.exerciseIdx=0; beginSegment('prepause'); }
// Exercises after the first are announced during the preceding rest.
function beginExercise(){ beginSegment('exercise'); if(pl.exerciseIdx===0) say(curEx().name); }
function beginRest(){
  beginSegment('rest');
  const nx=pl.training.exercises[pl.exerciseIdx+1]; if(nx) say('Next: '+nx.name);
}

// The exercise on the card: during rest the upcoming one.
const shownEx=()=>pl.phase==='rest'&&pl.training.exercises[pl.exerciseIdx+1]||curEx();
// Static content of a segment.
function renderSegment(){
  const exs=pl.training.exercises, next=exs[pl.exerciseIdx+1], rest=pl.phase==='rest', shown=shownEx();
  slideTo(viewAt(segOrd()),()=>{
    $('pl-phase').textContent={prepause:'GET READY',exercise:'EXERCISE',rest:'REST'}[pl.phase];
    $('pl-phase').className='player-phase is-'+pl.phase;
    $('pl-name').textContent=shown.name;
    setDesc(autolink(shown.description||''));
    $('pl-image').innerHTML=esc(shown.emoji||'💪')+imgTag(shown.imageUrl);
  });
  $('player-area').dataset.phase=pl.phase;
  $('pl-next').innerHTML=rest ? ''
    : next ? `Next: <span>${esc(next.name)}</span>` : 'Last exercise';
  $('pl-counter').textContent=`${pl.exerciseIdx+1} / ${exs.length}`;
  const restLike=pl.phase!=='exercise';
  $('pl-timer').className='player-timer'+(restLike?' rest-time':'');
  $('pl-bar').className='player-progress-bar'+(restLike?' resting':'');
}

// Per-tick updates.
function renderPlayer(){
  const tm=$('pl-timer'), txt=String(pl.secondsLeft);
  if(tm.textContent!==txt){ tm.textContent=txt; if(pl.secondsLeft<=3&&pl.secondsLeft>0)replay(tm,'tick'); }
  $('pl-playpause').classList.toggle('running',pl.running);
  const max=segmentDuration();
  $('player-area').style.setProperty('--p',pl.phase==='exercise'&&max?Math.min(1,(max-pl.secondsLeft+(pl.running?1:0))/max):0);
  $('pl-bar').style.width=(max?(max-pl.secondsLeft)/max*100:100)+'%';
  $('pp-pause').style.display=pl.running?'':'none';
  $('pp-play').style.display=pl.running?'none':'';
}

function startTick(){
  clearInterval(pl.timer);
  // Anchor to wall-clock so the timer stays accurate even when the browser
  // throttles setInterval while the app is backgrounded (music-switch etc.).
  pl.tickAnchor={startMs:Date.now(),startLeft:pl.secondsLeft,lastLeft:pl.secondsLeft};
  pl.timer=setInterval(tickStep,1000);
}
function tickStep(){
  if(!pl.running||!pl.tickAnchor)return;
  const a=pl.tickAnchor;
  const newLeft=a.startLeft-Math.floor((Date.now()-a.startMs)/1000);
  // Fire beeps for seconds we just crossed. If the tab was backgrounded
  // and many seconds passed, skip the catch-up beeps (no audio flood).
  if(a.lastLeft-newLeft<=2){
    const half=pl.phase==='exercise'?Math.floor(curEx().s/2):null;
    for(let s=a.lastLeft-1;s>=newLeft&&s>0;s--){
      if(s===half){ soundHalf(); replay($('player-area'),'half'); }
      if(s<=3)soundCount(s===1);
    }
  }
  pl.secondsLeft=Math.max(0,newLeft);
  if(newLeft<=0) return playerNext();
  a.lastLeft=newLeft;
  renderPlayer();
}

function playerToggle(){ pl.running=!pl.running; if(pl.running)startTick(); else clearInterval(pl.timer); renderPlayer(); }
// The description is clamped; "more" shows it whole in a sheet.
function setDesc(html){
  const d=$('pl-desc');
  d.innerHTML=html;
  $('pl-more').hidden=d.scrollHeight<=d.clientHeight+2;
}
function showDesc(){ const e=shownEx(); openModal(e.name,`<p class="modal-text">${autolink(e.description)}</p>`); }
// Natural flow: prepause → exercise 0 → rest 0 → exercise 1 → … → finish.
function playerNext(){
  clearInterval(pl.timer);
  if(pl.phase==='prepause') beginExercise();
  else if(pl.phase==='rest'){ pl.exerciseIdx++; beginExercise(); }
  else if(pl.exerciseIdx+1<pl.training.exercises.length) beginRest();
  else finishWorkout();
}
// Previous segment in the flow (swipe back); prepause restarts itself.
function playerBack(){
  clearInterval(pl.timer);
  if(pl.phase==='prepause') beginPrepause();
  else if(pl.phase==='rest') beginExercise();
  else if(pl.exerciseIdx>0){ pl.exerciseIdx--; beginRest(); }
  else beginPrepause();
}
// Like an audio player's back button: restart the segment, or go to the
// previous one when already within its first second.
function playerPrev(){
  if(pl.secondsLeft>=segmentDuration()-1) return playerBack();
  clearInterval(pl.timer);
  ({prepause:beginPrepause,exercise:beginExercise,rest:beginRest})[pl.phase]();
}
function stopPlayer(){ clearInterval(pl.timer); $('pl-playpause').classList.remove('running'); pl.running=false; pl.tickAnchor=null; releaseWakeLock(); }
function exitPlayer(){ stopPlayer(); goDetail(); }
function finishWorkout(){
  stopPlayer(); soundDone();
  const t=getTraining();
  if(t){t.lastCompleted=new Date().toISOString();save();}
  $('player-area').dataset.phase='done';
  say('Well done!');
  slideTo(viewAt(2*pl.training.exercises.length),()=>{
    $('pl-phase').textContent='DONE';
    $('pl-phase').className='player-phase';
    $('pl-name').textContent='Well done! 🎉';
    setDesc('Workout complete.');
    $('pl-image').className='player-image';
    $('pl-image').innerHTML='🏆';
    replay($('pl-image'),'trophy');
  });
  const tm=$('pl-timer');
  tm.textContent='✓';
  tm.className='player-timer finish-check';
  tm.setAttribute('role','button');
  tm.setAttribute('tabindex','0');
  tm.onclick=goHome;
  $('pl-bar').style.width='100%';
  $('pl-bar').className='player-progress-bar';
  $('pl-next').innerHTML='';
  $('pl-counter').textContent='Done';
  document.querySelector('.player-controls').style.display='none';
}

// ─── Player slide / swipe ─────────────────────────────────────
// The flow as a strip of positions: prepause=0, exercise N=2N+1, rest N=2N+2,
// done=2n. Each position shows a card (emoji, name, description); prepause
// and rest show the upcoming exercise's card plus the Up-next badge. Moving
// between positions slides the card, or only the badge when the card stays.
const segOrd=()=>pl.phase==='prepause'?0:2*pl.exerciseIdx+(pl.phase==='exercise'?1:2);
function viewAt(ord){
  const n=pl.training.exercises.length;
  if(ord<0||ord>2*n) return null;
  if(ord===2*n) return {ord,card:'done',badge:false};
  if(ord===0) return {ord,card:0,badge:true};
  return ord%2?{ord,card:(ord-1)/2,badge:false}:{ord,card:ord/2,badge:true};
}
const SLIDE_MS=320, EASE_OUT='cubic-bezier(.16,1,.3,1)', EASE_ON='cubic-bezier(.3,0,.4,1)';
const reducedMotion=matchMedia('(prefers-reduced-motion:reduce)');
const badgeDist=W=>Math.min(160,W*.4);
const tx=x=>`translateX(${x}px)`;
// Current on-screen position/opacity (drag or running animation), then
// cleared so the element is back at its resting state.
function grab(el){
  const cs=getComputedStyle(el);
  const at={transform:cs.transform,opacity:cs.opacity,x:cs.transform==='none'?0:new DOMMatrix(cs.transform).m41};
  el.getAnimations().forEach(a=>a.cancel());
  el.style.transform=el.style.opacity='';
  return at;
}
// Static copy that animates out while the real element shows the new content.
function slideOut(el,at,to){
  const g=el.cloneNode(true);
  g.removeAttribute('id'); g.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id'));
  g.classList.add('pl-ghost');
  Object.assign(g.style,{left:el.offsetLeft+'px',top:el.offsetTop+'px',width:el.offsetWidth+'px'});
  el.parentElement.appendChild(g);
  g.animate([at,{transform:tx(to),opacity:0}],{duration:SLIDE_MS,easing:EASE_ON}).onfinish=()=>g.remove();
}
// The phase pill changes on every step; the card only when the shown
// exercise changes, otherwise just the Up-next badge moves.
function slideTo(v,update){
  const prev=pl.view, card=$('pl-card'), badge=$('pl-upnext'), pill=$('pl-phase'), zone=card.parentElement;
  pl.view=v;
  const dir=prev?Math.sign(v.ord-prev.ord):0, motion=dir&&!reducedMotion.matches;
  const cAt=grab(card), bAt=grab(badge), pAt=grab(pill);
  const W=zone.clientWidth, D=badgeDist(W), cardChanges=!prev||prev.card!==v.card;
  if(dir) zone.classList.remove('swap');
  if(motion){
    slideOut(pill,pAt,pAt.x-dir*D);
    if(cardChanges) slideOut(card,cAt,cAt.x-dir*W);
  }
  update();
  badge.classList.toggle('on',v.badge);
  if(reducedMotion.matches) return;
  if(!dir){ replay(zone,'swap'); return; }
  pill.animate([{transform:tx(dir*D),opacity:0},{transform:'none',opacity:1}],{duration:SLIDE_MS,easing:EASE_OUT});
  if(cardChanges){
    card.animate([{transform:tx(dir*W*.5),opacity:0},{transform:'none',opacity:1}],{duration:SLIDE_MS+120,easing:EASE_OUT});
    return;
  }
  if(cAt.x) card.animate([cAt,{transform:'none',opacity:1}],{duration:250,easing:EASE_OUT});
  const half=badge.offsetWidth/2;
  if(prev.badge&&!v.badge)
    badge.animate([bAt,{transform:tx(bAt.x-dir*D),opacity:0}],{duration:SLIDE_MS*.8,easing:EASE_ON});
  else if(!prev.badge&&v.badge)
    badge.animate([+bAt.opacity>.01?bAt:{transform:tx(dir*D-half),opacity:0},{transform:tx(-half),opacity:1}],{duration:SLIDE_MS,easing:EASE_OUT});
}

// Horizontal swipe on the player: pill and card (or badge) follow the
// finger; release past a threshold or with a flick moves one position.
// Measurements are taken once per drag so moves only write styles.
const sw={id:null,x:0,y:0,dx:0,vx:0,t:0,drag:false,v:null,W:0,D:0,half:0};
const swEls=()=>[$('pl-card'),$('pl-upnext'),$('pl-phase')];
function dragStart(){
  swEls().forEach(grab);
  const W=$('pl-card').parentElement.clientWidth;
  Object.assign(sw,{v:pl.view,W,D:badgeDist(W),half:$('pl-upnext').offsetWidth/2});
}
function dragPaint(dx){
  if(pl.view!==sw.v) dragStart(); // segment auto-advanced mid-drag
  const [c,b,p]=swEls(), {W,D,half}=sw, cur=pl.view, to=viewAt(cur.ord+(dx<0?1:-1)), ad=Math.abs(dx);
  const st={c:['',''],b:['',''],p:['','']};
  if(!to) st.c=[tx(dx/4),''];
  else {
    st.p=[tx(dx),Math.max(0,1-ad/D)];
    if(to.card!==cur.card) st.c=[tx(dx),1-Math.min(1,ad/W)*.6];
    else if(cur.badge) st.b=[tx(dx-half),Math.max(0,1-ad/D)];
    else st.b=[tx((dx>0?Math.min(0,dx-D):Math.max(0,dx+D))-half),Math.min(1,ad/D)];
  }
  [[c,st.c],[b,st.b],[p,st.p]].forEach(([el,[t,o]])=>{ el.style.transform=t; el.style.opacity=o; });
}
function springBack(){
  swEls().forEach(el=>{
    if(!el.style.transform) return;
    const from=grab(el), rest=getComputedStyle(el);
    el.animate([from,{transform:rest.transform,opacity:rest.opacity}],{duration:280,easing:EASE_OUT});
  });
}
(()=>{
  const area=$('player-area');
  area.addEventListener('pointerdown',e=>{
    if(sw.id!=null||e.button>0||!pl.view||pl.view.card==='done'||e.target.closest('button,a,.player-top'))return;
    Object.assign(sw,{id:e.pointerId,x:e.clientX,y:e.clientY,dx:0,vx:0,t:e.timeStamp,drag:false});
  });
  area.addEventListener('pointermove',e=>{
    if(e.pointerId!==sw.id)return;
    const dx=e.clientX-sw.x, dy=e.clientY-sw.y;
    if(!sw.drag){
      if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){ sw.id=null; return; }
      if(Math.abs(dx)<10) return;
      sw.drag=true; sw.x+=Math.sign(dx)*10; dragStart();
      area.setPointerCapture(e.pointerId); area.classList.add('dragging');
    }
    const d=e.clientX-sw.x, dt=e.timeStamp-sw.t;
    if(dt>0) sw.vx=.7*(d-sw.dx)/dt+.3*sw.vx;
    sw.dx=d; sw.t=e.timeStamp;
    dragPaint(d);
  });
  const end=e=>{
    if(e.pointerId!==sw.id)return;
    sw.id=null;
    if(!sw.drag)return;
    area.classList.remove('dragging');
    swallowClick();
    const dx=sw.dx, dir=dx<0?1:-1, cur=pl.view, to=cur&&viewAt(cur.ord+dir);
    const thr=to&&to.card!==cur.card?sw.W*.25:sw.D*.5;
    const flick=Math.abs(dx)>30&&Math.sign(sw.vx)===Math.sign(dx)&&Math.abs(sw.vx)>.4;
    if(to&&e.type==='pointerup'&&(Math.abs(dx)>thr||flick)) dir>0?playerNext():playerBack();
    else springBack();
  };
  area.addEventListener('pointerup',end);
  area.addEventListener('pointercancel',end);
})();

// ─── Audio ────────────────────────────────────────────────────
const audioCtx=new (window.AudioContext||window.webkitAudioContext)();
audioCtx.suspend().catch(()=>{});
function speechVolume(){return state.settings.speechVolume==null?0:state.settings.speechVolume;}
// Voice list is populated asynchronously — Android Chrome reports an empty list
// on first call and fires `voiceschanged` once the TTS engine has answered.
let _voices=[];
function loadVoices(){try{_voices=speechSynthesis.getVoices()||[];}catch(e){_voices=[];}}
if('speechSynthesis' in window){
  loadVoices();
  speechSynthesis.addEventListener('voiceschanged',loadVoices);
  // Chrome's synthesis engine is browser-wide: an utterance wedged by an earlier
  // page stays wedged across reloads and silences everything. Clear it on start.
  try{speechSynthesis.cancel();}catch(e){}
}
// Match the browser's own language first. Android Chrome refuses to synthesise a
// language the browser isn't set to — English on a German Chrome fails outright
// with synthesis-failed, for every voice in the list. English is only a fallback,
// and a local voice beats a remote "Google …" one, which can hang without ever
// starting. Voices whose data was never downloaded also fail, so this is still
// just a first try; the retry assigns no voice at all and lets the device pick.
function pickVoice(){
  if(!_voices.length)loadVoices();
  const norm=l=>(l||'').toLowerCase().replace('_','-');
  const want=norm(navigator.language||'en');
  const match=l=>{const m=_voices.filter(v=>norm(v.lang).startsWith(l));return m.find(v=>v.localService)||m[0]||null;};
  return match(want)||match(want.split('-')[0])||match('en')||null;
}
function say(text,notify){
  const v=speechVolume();if(v<=0||!('speechSynthesis' in window))return;
  const vol=Math.min(1,v*1.5);
  let started=false,watchdog=null;
  const fail=msg=>{if(notify)toast(msg);};
  const speak=retry=>{
    const u=new SpeechSynthesisUtterance(text);
    u.rate=1.05;u.volume=vol;
    // Retry deliberately sets no voice and no lang: the device default is the
    // only option that can't reference missing voice data.
    const voice=retry?null:pickVoice();
    if(voice){u.voice=voice;u.lang=voice.lang;}
    u.onstart=()=>{started=true;clearTimeout(watchdog);};
    u.onerror=e=>{
      clearTimeout(watchdog);
      if(e.error==='interrupted'||e.error==='canceled')return;
      // A hard failure on the first try is usually the chosen voice, not the
      // engine — fall back to a local voice / the device default before giving up.
      if(retry)fail('Speech failed: '+e.error);
      else setTimeout(()=>speak(true),120);
    };
    speechSynthesis.speak(u);
    try{speechSynthesis.resume();}catch(e){} // no-op unless the engine is paused
    // Accepted but never started: wedged engine, or a remote voice that never
    // answers. Reset and retry once with a local voice / the device default.
    watchdog=setTimeout(()=>{
      if(started)return;
      try{speechSynthesis.cancel();}catch(e){}
      if(retry)fail('No speech output — check the device text-to-speech engine');
      else setTimeout(()=>speak(true),120);
    },2000);
  };
  // cancel() followed by speak() in the same task drops the utterance on
  // Android Chrome — only cancel when something is actually queued, then yield.
  if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel();setTimeout(()=>speak(false),60);}
  else speak(false);
}
function audioVolume(){return state.settings.audioVolume==null?1.0:state.settings.audioVolume;}
// PIZZ — koto variant: drier, shorter, more percussive
// Signature matches the sounds-file convention: (ac, t, pitch, accent)
function s_pizz(ac,t,p,accent){
  const v=audioVolume();if(v<=0)return;
  const dur=accent?0.32:0.22;
  const len=Math.floor(ac.sampleRate*0.008);
  const buf=ac.createBuffer(1,len,ac.sampleRate);
  const data=buf.getChannelData(0);for(let i=0;i<len;i++)data[i]=Math.random()*2-1;
  const noise=ac.createBufferSource();noise.buffer=buf;
  const nf=ac.createBiquadFilter();nf.type='bandpass';nf.frequency.value=p*3;nf.Q.value=2;
  const ng=ac.createGain();
  ng.gain.setValueAtTime(0,t);ng.gain.linearRampToValueAtTime(v*0.8,t+0.0005);ng.gain.exponentialRampToValueAtTime(0.0001,t+0.009);
  noise.connect(nf).connect(ng).connect(ac.destination);noise.start(t);noise.stop(t+0.015);
  const osc=ac.createOscillator();osc.type='triangle';osc.frequency.value=p;
  const flt=ac.createBiquadFilter();flt.type='lowpass';flt.Q.value=2.5;
  flt.frequency.setValueAtTime(p*8,t);flt.frequency.exponentialRampToValueAtTime(p*1.5,t+0.08);
  const g=ac.createGain();
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v*1.6,t+0.001);g.gain.exponentialRampToValueAtTime(0.0001,t+0.001+dur);
  osc.connect(flt).connect(g).connect(ac.destination);osc.start(t);osc.stop(t+dur+0.03);
}
// Active theme — swap fn + base to restyle every cue at once.
// fn signature: (ac, audioContext, pitch, accent) => void
const THEME={fn:s_pizz,base:440};
const _F=1.498,_TH=1.26; // perfect fifth, major third
function soundRun(notes){
  const v=audioVolume();if(v<=0)return;
  const play=()=>{try{
    const t0=audioCtx.currentTime+0.02;
    notes.forEach(n=>THEME.fn(audioCtx,t0+(n.dt||0),THEME.base*(n.ratio||1),!!n.accent));
  }catch(e){}};
  if(audioCtx.state==='suspended'){audioCtx.resume().then(play).catch(()=>{});}
  else{play();}
}
// Cue functions — called from the player
function soundHalf() {soundRun([{ratio:1/_TH},{ratio:1,dt:0.15}]);}
function soundCount(last){soundRun([{ratio:last?_F:1,accent:last}]);}
function soundDone() {soundRun([{ratio:1},{ratio:_TH,dt:0.12},{ratio:_F,dt:0.24,accent:true}]);}

// ─── Wake Lock ────────────────────────────────────────────────
let wakeLock=null;
async function requestWakeLock(){
  if('wakeLock' in navigator){try{wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null;});}catch(e){}}}
function releaseWakeLock(){if(wakeLock){wakeLock.release();wakeLock=null;}}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&pl.running){
    requestWakeLock();
    // Sync immediately — setInterval may have been throttled while hidden.
    tickStep();
  }
});

// ─── Settings / Import / Export ───────────────────────────────
function handleSwWaiting(sw){
  _swWaiting = sw;
  if(autoUpdateEnabled()){ applySwUpdate(); return; }
  toast('New version available!');
  if(isModalOpen()) openSettings();
}
function applySwUpdate(){ if(!_swWaiting) return; _swWaiting.postMessage({type:'SKIP_WAITING'}); toast('Updating…'); }
function setAutoUpdate(v){ state.settings.autoUpdate=v; save(); }
// Slider handler: oninput stores, onchange (preview=1) also plays a sample.
function setVol(key,el,preview){
  const n=Number(el.value);
  state.settings[key]=n/100; save();
  el.classList.toggle('muted',n<=0);
  if(preview&&n>0){ if(key==='speechVolume') say('Test',1); else soundHalf(); }
}
function volSlider(id,key,vol){
  return `<input id="${id}" type="range" min="0" max="150" value="${vol}" oninput="setVol('${key}',this)" onchange="setVol('${key}',this,1)" class="${vol<=0?'muted':''}">`;
}
function openSettings(){
  const vol=Math.round(audioVolume()*100);
  const svol=Math.round(speechVolume()*100);
  openModal('Settings',`
    <div class="setting-row"><div class="setting-label">Audio volume<small>Beeps during the workout</small></div>${volSlider('vol-slider','audioVolume',vol)}</div>
    <div class="setting-row"><div class="setting-label">Speech volume<small>Announces the next exercise (experimental)</small></div>${volSlider('speech-slider','speechVolume',svol)}</div>
    <div class="setting-row"><div class="setting-label">Export trainings<small>Download all trainings as JSON</small></div><button class="btn btn-secondary" onclick="exportData()">Export</button></div>
    <div class="setting-row"><div class="setting-label">Import trainings<small>Add trainings from a JSON file</small></div><button class="btn btn-secondary" onclick="$('import-file').click()">Import</button><input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)"></div>
    <div class="setting-row"><div class="setting-label">Reset all<small>Delete everything and start fresh</small></div><button class="btn btn-danger" onclick="resetAll()">Reset</button></div>
    <div class="setting-row"><div class="setting-label">Auto-update<small>Apply app updates automatically on startup</small></div><label class="toggle"><input type="checkbox" ${autoUpdateEnabled()?'checked':''} onchange="setAutoUpdate(this.checked)"><span class="toggle-slider"></span></label></div>
    <div class="setting-row"><div class="setting-label">Version<small>v${APP_VERSION}</small></div><button class="btn ${_swWaiting?'btn-primary':'btn-secondary'}" onclick="checkForUpdate()">${_swWaiting?'Update now':'Check for update'}</button></div>
    <div class="about">
      <strong>Pulse</strong><br>
      Open-source interval workout timer. Your data stays on your device — nothing is sent to any server.<br>
      Exercise data from <a href="https://wger.de" target="_blank" rel="noopener">wger.de</a>.<br>
      <a href="https://github.com/schuhwerk/pulse/" target="_blank" rel="noopener">github.com/schuhwerk/pulse</a>
    </div>
  `);
}
function exportData(){
  const d=new Date(), p2=n=>String(n).padStart(2,'0');
  const stamp=String(d.getFullYear()).slice(-2)+p2(d.getMonth()+1)+p2(d.getDate());
  downloadJson('pulse-trainings-'+stamp+'.json',{trainings:state.trainings.map(toSharePayload),exportedAt:d.toISOString()});
  toast('Exported!');
}
function importData(ev){
  const file=ev.target.files[0]; if(!file)return;
  const r=new FileReader();
  r.onload=function(){
    try{
      const d=JSON.parse(r.result);
      // Trainings export, or an older full-state backup: { trainings:[...], ... }
      if(d&&Array.isArray(d.trainings)){
        confirmTrainingsImport(d); return;
      }
      // Otherwise treat as a single-training share/export payload
      confirmImportTraining(d);
    }
    catch(e){ toast(e.message||'Invalid file'); }
  };
  r.readAsText(file);
}
function resetAll(){if(!confirm('Delete all data?'))return;state=defaultState();save();closeModal();goHome();toast('Reset!');}

function checkForUpdate(){
  if(_swWaiting){ applySwUpdate(); return; }
  if(!('serviceWorker' in navigator)){toast('Not supported');return;}
  navigator.serviceWorker.getRegistration().then(reg=>{
    if(!reg){toast('No service worker');return;}
    toast('Checking…');
    reg.update().then(()=>{
      // If a waiting worker appeared immediately
      if(reg.waiting){handleSwWaiting(reg.waiting);if(!autoUpdateEnabled())openSettings();return;}
      // If a new worker is installing, wait for it
      if(reg.installing){
        waitForInstalled(reg.installing);return;
      }
      // Otherwise listen briefly for updatefound
      let resolved=false;
      const onUpdate=()=>{resolved=true;reg.removeEventListener('updatefound',onUpdate);waitForInstalled(reg.installing);};
      reg.addEventListener('updatefound',onUpdate);
      setTimeout(()=>{if(!resolved){reg.removeEventListener('updatefound',onUpdate);toast('Already up to date');}},3000);
    }).catch(()=>toast('Update check failed'));
  });
}
function waitForInstalled(sw){
  sw.addEventListener('statechange',()=>{
    if(sw.state==='installed'){
      handleSwWaiting(sw);
      if(!autoUpdateEnabled()){openSettings();toast('Update ready!');}
    }
  });
}

// ─── Modal ────────────────────────────────────────────────────
// opts.guard: warn before discarding edits when the user dismisses the modal.
// closeModal() is the programmatic close (after save) and never asks.
function openModal(title,html,opts={}){
  const body=$('modal-body');
  $('modal-title').textContent=title;
  body.innerHTML=html;
  if(opts.guard)guardForm(body);else delete body.dataset.snap;
  $('modal').classList.add('open');
}
function closeModal(){$('modal').classList.remove('open');}
function isModalOpen(){ return $('modal').classList.contains('open'); }
function requestCloseModal(){ if(confirmDiscard($('modal-body')))closeModal(); }
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&isModalOpen())requestCloseModal();});
// Confirm dialog with Cancel/OK and an optional extra button. Dismissing via Esc/backdrop runs neither callback.
let _modalAnswers={};
function confirmModal(title,html,okLabel,onOk,{cancelLabel='Cancel',onCancel=null,extraLabel=null,onExtra=null}={}){
  _modalAnswers={ok:onOk,cancel:onCancel,extra:onExtra};
  openModal(title,`${html}
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="answerModal('cancel')">${cancelLabel}</button>
      ${extraLabel?`<button class="btn btn-secondary" onclick="answerModal('extra')">${extraLabel}</button>`:''}
      <button class="btn btn-primary" onclick="answerModal('ok')">${okLabel}</button>
    </div>`);
}
function answerModal(which){
  const f=_modalAnswers[which];
  _modalAnswers={};
  closeModal(); if(f)f();
}
function modalList(items){ return `<ul class="modal-list">${items.map(i=>`<li>${i}</li>`).join('')}</ul>`; }

// Swipe down dismisses the bottom sheet: from the header always, from the body
// only when it is scrolled to the top. Wide screens show a dialog instead.
const dialogMQ=matchMedia('(min-width:720px) and (min-height:560px)');
(()=>{
  const ov=$('modal'), sheet=ov.querySelector('.modal'), body=$('modal-body');
  const d={id:null,x:0,y:0,dy:0,v:0,t:0,drag:false,top:false};
  const settle=()=>{ const {transform}=grab(sheet); if(!reducedMotion.matches) sheet.animate([{transform},{transform:'none'}],{duration:250,easing:EASE_OUT}); };
  const dismiss=()=>{
    const {transform}=grab(sheet);
    if(reducedMotion.matches) return closeModal();
    ov.animate([{opacity:1},{opacity:0}],{duration:200});
    sheet.animate([{transform},{transform:'translateY(100%)'}],{duration:200,easing:EASE_ON}).onfinish=closeModal;
  };
  sheet.addEventListener('pointerdown',e=>{
    if(d.id!=null||e.button>0||dialogMQ.matches||e.target.closest('input,textarea,select'))return;
    Object.assign(d,{id:e.pointerId,x:e.clientX,y:e.clientY,dy:0,v:0,t:e.timeStamp,drag:false,top:!body.contains(e.target)||body.scrollTop<=0});
  });
  sheet.addEventListener('pointermove',e=>{
    if(e.pointerId!==d.id)return;
    const dy=e.clientY-d.y, dx=e.clientX-d.x;
    if(!d.drag){
      if(Math.max(Math.abs(dx),Math.abs(dy))<4) return;
      if(!d.top||dy<=Math.abs(dx)){ d.id=null; return; }
      d.drag=true; sheet.setPointerCapture(e.pointerId);
    }
    const y=Math.max(0,dy), dt=e.timeStamp-d.t;
    if(dt>0) d.v=.7*(y-d.dy)/dt+.3*d.v;
    d.dy=y; d.t=e.timeStamp;
    sheet.style.transform=`translateY(${y}px)`;
  });
  // Pointer events can't stop touch scrolling; a non-passive touchmove can.
  sheet.addEventListener('touchmove',e=>{ if(d.drag)e.preventDefault(); },{passive:false});
  const end=e=>{
    if(e.pointerId!==d.id)return;
    d.id=null;
    if(!d.drag)return;
    swallowClick();
    const far=d.dy>sheet.offsetHeight/4||d.dy>30&&d.v>.4;
    if(e.type==='pointerup'&&far&&confirmDiscard(body)) dismiss();
    else settle();
  };
  sheet.addEventListener('pointerup',end);
  sheet.addEventListener('pointercancel',end);
})();

// ─── Unsaved-changes guard ────────────────────────────────────
// guardForm snapshots a container's field values; it counts as dirty once they
// differ. Fields marked data-noguard (e.g. search boxes) are ignored.
function formSnap(el){
  return [...el.querySelectorAll('input,textarea,select')].filter(f=>!f.hasAttribute('data-noguard'))
    .map(f=>f.type==='checkbox'?f.checked:f.value).join('\u0000');
}
function guardForm(el){ if(el)el.dataset.snap=formSnap(el); }
function isDirty(el){ return !!el&&el.dataset.snap!=null&&formSnap(el)!==el.dataset.snap; }
function confirmDiscard(el){ return !isDirty(el)||confirm('Discard unsaved changes?'); }
function anyFormDirty(){
  const modalOpen=$('modal').classList.contains('open');
  const addActive=$('view-add').classList.contains('active');
  return (modalOpen&&isDirty($('modal-body')))||(addActive&&isDirty($('tab-manual')));
}
window.addEventListener('beforeunload',e=>{ if(anyFormDirty())e.preventDefault(); });

// ─── Helpers ──────────────────────────────────────────────────
// Image layered over the emoji. A broken image removes itself, so the emoji shows through.
function imgTag(url,attrs=''){
  if(!url)return '';
  return `<img src="${esc(url)}" alt="" ${attrs} class="${isWgerUrl(url)?'wger-img':''}" onerror="this.remove()">`;
}
// First user-perceived character, so multi-codepoint emoji (👍🏽, 🏋️‍♀️) stay intact.
function firstGrapheme(str){
  str=String(str||'').trim(); if(!str)return '';
  if(window.Intl&&Intl.Segmenter){ for(const {segment} of new Intl.Segmenter().segment(str))return segment; }
  return Array.from(str)[0];
}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
function autolink(s){return esc(s).replace(/\n/g,'<br>').replace(/(https?:\/\/[^\s<]+)/g,(u)=>{const label=u.length>40?u.slice(0,37)+'…':u;return '<a href="'+u+'" target="_blank" rel="noopener">'+label+'</a>';});}
function downloadJson(filename,obj){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));
  a.download=filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
// Swallows the click that the pointerup ending a drag would fire.
function swallowClick(){
  const f=e=>{ e.stopPropagation(); e.preventDefault(); };
  addEventListener('click',f,true);
  setTimeout(()=>removeEventListener('click',f,true),0);
}
function isWgerUrl(url){ return !!url&&url.includes('wger.de'); }
function wgerImg(url){if(!url)return '';return url.startsWith('/')?'https://wger.de'+url:url;}

const btnInst = $('btn-install');
if (isDebug && btnInst) btnInst.style.display = '';

window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); bPrompt = e; if (btnInst) btnInst.style.display = ''; });

routeHash();
const _pending=getPendingBuiltinUpdates();
